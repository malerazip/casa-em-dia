<style>#login{position:fixed;inset:0;z-index:100;background:#f5f7fb;display:flex;align-items:center;justify-content:center;padding:24px 16px}
#login[hidden]{display:none}
.login-card{width:100%;max-width:360px;background:#fff;border:1px solid #e4eaf2;border-radius:16px;padding:28px 22px;display:flex;flex-direction:column;gap:14px;font-family:"Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17243b}
.login-brand{display:flex;align-items:center;gap:10px;margin-bottom:6px}.login-brand span{width:40px;height:40px;border-radius:11px;background:#2765df;display:grid;place-items:center}
.login-brand b{font-size:20px;line-height:1.05;letter-spacing:-.5px}
.login-card label{display:flex;flex-direction:column;gap:6px;font-size:14px;color:#52627a}
.login-card input{font:inherit;font-size:16px;border:1px solid #dce4ef;border-radius:9px;padding:11px 12px;color:#17243b;background:#fff}
.login-card input:focus{outline:2px solid #2765df55;border-color:#2765df}
.login-card button{font:inherit;font-weight:600;font-size:16px;background:#2765df;color:#fff;border:0;border-radius:9px;padding:12px;margin-top:4px;cursor:pointer}
.login-card button:disabled{opacity:.6}
#login-error{background:#fdeeee;color:#a33a3a;border-radius:8px;padding:10px 12px;font-size:14px}
.login-card small{color:#8a96a8;font-size:13px;text-align:center}
@media (max-width:560px){.logout-btn{margin-left:0!important;margin-top:10px}}
</style>

<div id="login" hidden>
<form id="login-form" class="login-card" autocomplete="on">
<div class="login-brand"><span><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M4 11 12 4l8 7v9H4z"/><path d="m9 15 2 2 4-4.5" stroke="#a7ead9" stroke-linecap="round"/></svg></span><b>casa<br>em dia.</b></div>
<label>E-mail<input id="login-email" type="email" autocomplete="username" required></label>
<label>Senha<input id="login-pass" type="password" autocomplete="current-password" required></label>
<div id="login-error" hidden></div>
<button id="login-btn" type="submit">Entrar</button>
<small>Esqueceu a senha? O Alexandre redefine para você.</small>

 if(r.error){showLogin(friendly(r.error));return}
 if(!r.data){await sb.auth.signOut();showLogin("Esta conta não tem acesso à casa.");return}
 window.__casaStore.person=r.data.pessoa;$("login").hidden=true;
 if(!booted){booted=true;var s=document.createElement("script");s.textContent=$("app-src").textContent;document.body.appendChild(s)}}
$("login-form").addEventListener("submit",async function(ev){ev.preventDefault();var b=$("login-btn");b.disabled=true;b.textContent="Entrando…";$("login-error").hidden=true;
 try{var r=await sb.auth.signInWithPassword({email:$("login-email").value.trim(),password:$("login-pass").value});
  if(r.error){showLogin(/invalid/i.test(r.error.message)?"E-mail ou senha incorretos.":friendly(r.error));return}
  await enter(r.data.session)}catch(e){showLogin(friendly(e))}});
sb.auth.onAuthStateChange(function(ev){if(ev==="SIGNED_OUT"&&booted)location.reload()});
sb.auth.getSession().then(function(r){var s=r.data&&r.data.session;if(s)enter(s).catch(function(e){showLogin(friendly(e))});else showLogin()}).catch(function(){showLogin()});
})();
</script>
</body>
</html>
